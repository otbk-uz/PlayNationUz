<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tepalikni yakka egallab tur — ball yig'. King of the Hill (PvP)." />
  <link rel="canonical" href="https://uzindiegame.uz/games/toj/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="UzIndieGame" />
  <meta property="og:title" content="Toj — UzIndieGame" />
  <meta property="og:description" content="Tepalikni yakka egallab tur — ball yig'. King of the Hill (PvP)." />
  <meta property="og:image" content="https://uzindiegame.uz/covers/toj.png" />
  <meta property="og:url" content="https://uzindiegame.uz/games/toj/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Toj — UzIndieGame" />
  <meta name="twitter:description" content="Tepalikni yakka egallab tur — ball yig'. King of the Hill (PvP)." />
  <meta name="twitter:image" content="https://uzindiegame.uz/covers/toj.png" />
  <link rel="icon" type="image/png" href="./assets/logo.png" />
  <title>Toj — Tepalik Hokimi</title>
  <link rel="stylesheet" href="./_shared/neon.css" />
  <link rel="stylesheet" href="./style.css" />
<script>window.__UZG_SLUG="toj";</script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>👑 Toj</h1>
      <p class="tag">Markazdagi tepalikni yakka egallab tur — ball yig'! (online PvP)</p>
    </header>

    <!-- LOBBY -->
    <section id="lobby" class="panel">
      <div class="field">
        <label>Ismingiz</label>
        <input id="nick" maxlength="16" placeholder="Masalan: Ali" />
      </div>
      <div class="row">
        <button id="createBtn">Yangi xona ochish</button>
        <span class="or">yoki</span>
        <div class="join">
          <input id="roomInput" maxlength="4" placeholder="KOD" />
          <button id="joinBtn" class="ghost">Kirish</button>
        </div>
      </div>
      <p id="serverNote" class="server-note"></p>
    </section>

    <!-- ROOM (kutish xonasi) -->
    <section id="room" class="panel hidden">
      <div class="room-head">
        <div>Xona kodi: <span id="roomCode" class="code">----</span></div>
        <button id="copyBtn" class="ghost small">Nusxa</button>
      </div>
      <p class="muted">Do'stlaringizga shu kodni yuboring. Kamida 2 o'yinchi kerak.</p>
      <ul id="playerList" class="players"></ul>
      <button id="startBtn" class="hidden">Boshlash</button>
      <p id="waitNote" class="muted"></p>
    </section>

    <!-- GAME -->
    <section id="game" class="panel hidden">
      <div class="board">
        <canvas id="canvas" width="800" height="600"></canvas>
      </div>
      <p class="muted controls-hint">Boshqaruv: ← ↑ → ↓ yoki W A S D</p>
      <div class="controls-mobile" aria-hidden="true">
        <button data-k="up">▲</button>
        <div><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div>
      </div>
    </section>

    <!-- OVER -->
    <section id="over" class="panel hidden">
      <h2 id="overTitle">O'yin tugadi</h2>
      <ol id="scoreList" class="scores"></ol>
      <p class="muted">6 soniyadan keyin xonaga qaytamiz...</p>
    </section>

    <p id="status" class="status"></p>
  </div>

  <script src="./_shared/config.js"></script>
  <script src="./net.js"></script>
  <script src="./_shared/fx.js"></script>
  <script src="./_shared/catalog.js"></script>
  <script src="./_shared/guide.js"></script>
  <script src="./_shared/cats-badge.js"></script>
  <script src="./_shared/analytics.js"></script>
  <script src="./game.js"></script>
  <script src="./assets/cf-analytics.js"></script>
</body>
</html>
