<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Predmetga aylanib yashirin yoki hammani top (prop hunt)." />
  <link rel="canonical" href="https://uzindiegame.uz/games/soya/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="UzIndieGame" />
  <meta property="og:title" content="Soya — UzIndieGame" />
  <meta property="og:description" content="Predmetga aylanib yashirin yoki hammani top (prop hunt)." />
  <meta property="og:image" content="https://uzindiegame.uz/covers/soya.png" />
  <meta property="og:url" content="https://uzindiegame.uz/games/soya/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Soya — UzIndieGame" />
  <meta name="twitter:description" content="Predmetga aylanib yashirin yoki hammani top (prop hunt)." />
  <meta name="twitter:image" content="https://uzindiegame.uz/covers/soya.png" />
  <link rel="icon" type="image/png" href="./assets/logo.png" />
  <title>Soya — berkinmachoq + prop hunt</title>
  <link rel="stylesheet" href="./_shared/neon.css" />
  <link rel="stylesheet" href="./style.css" />
<script>window.__UZG_SLUG="soya";</script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎭 Soya</h1>
      <p class="tag">Predmetga aylanib yashirin, yoki hammani top! (online)</p>
    </header>

    <section id="lobby" class="panel">
      <div class="field"><label>Ismingiz</label><input id="nick" maxlength="16" placeholder="Masalan: Ali" /></div>
      <div class="row">
        <button id="createBtn">Yangi xona ochish</button>
        <span class="or">yoki</span>
        <div class="join"><input id="roomInput" maxlength="4" placeholder="KOD" /><button id="joinBtn" class="ghost">Kirish</button></div>
      </div>
      <p id="serverNote" class="server-note"></p>
    </section>

    <section id="room" class="panel hidden">
      <div class="room-head"><div>Xona kodi: <span id="roomCode" class="code">----</span></div><button id="copyBtn" class="ghost small">Nusxa</button></div>
      <p class="muted">Kamida 2 o'yinchi. Biri Qidiruvchi, qolganlar Yashiringan bo'ladi.</p>
      <ul id="playerList" class="players"></ul>
      <button id="startBtn" class="hidden">Boshlash</button>
      <p id="waitNote" class="muted"></p>
    </section>

    <section id="game" class="panel hidden">
      <div class="scorebar">
        <span id="roleTag" class="role-tag"></span>
        <span id="phaseTag"></span>
        <span id="timer" class="timer">--</span>
      </div>
      <div class="board"><canvas id="canvas" width="800" height="600"></canvas></div>
      <p id="hint" class="muted controls-hint"></p>
      <div class="controls-mobile" aria-hidden="true">
        <button data-k="up">▲</button>
        <div><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div>
      </div>
    </section>

    <section id="over" class="panel hidden">
      <h2 id="overTitle">O'yin tugadi</h2>
      <ol id="scoreList" class="scores"></ol>
      <p class="muted">6 soniyadan keyin xonaga qaytamiz...</p>
    </section>

    <p id="status" class="status"></p>
  </div>
  <script src="./_shared/config.js"></script>
  <script src="./net.js"></script>
  <script src="./_shared/fx.js"></script>
  <script src="./_shared/catalog.js"></script>
  <script src="./_shared/guide.js"></script>
  <script src="./_shared/cats-badge.js"></script>
  <script src="./_shared/analytics.js"></script>
  <script src="./game.js"></script>
  <script src="./assets/cf-analytics.js"></script>
</body>
</html>
